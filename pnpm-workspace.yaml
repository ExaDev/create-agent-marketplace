packages:
  - packages/*
# The alias package depends on its sibling at an exact version; linking resolves that version to the workspace copy, so no registry lookup is needed (or possible before the first release).
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@exadev/*'
  - create-agent-marketplace
  - create-claude-marketplace
# esbuild's install script only verifies a binary that the platform package already ships; tsx works without it.
allowBuilds:
  esbuild: false
