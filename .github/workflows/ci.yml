name: ci

# No path filter: a required check that is skipped by a filter never reports, and the pull request then waits forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      # The packages publish compiled output, so the build must compile on every change.
      - run: pnpm run build

  commitlint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Full history so the whole range of the pull request is available to commitlint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Runs the built CLI against the template for every content set and validates each result, so the CLI and the template cannot drift apart. It gates the release job.
  template-selfcheck:
    name: template-selfcheck (${{ matrix.content }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A literal list, never computed, so the matrix cannot be empty.
        content: [skills, claude, 'skills,claude']
    env:
      # The CLI makes an initial commit in the generated repository.
      GIT_AUTHOR_NAME: selfcheck
      GIT_AUTHOR_EMAIL: selfcheck@example.invalid
      GIT_COMMITTER_NAME: selfcheck
      GIT_COMMITTER_EMAIL: selfcheck@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      # The template's development head, not the tag that matches this CLI's version: a version's tag does not exist until the template is released for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ExaDev/agent-marketplace-template
          ref: main
          path: template
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Generate from the template
        env:
          CONTENT: ${{ matrix.content }}
          # Runners do not have the Claude Code CLI; the template's validation runs this command in place of `claude`.
          CLAUDE_COMMAND: npx --yes @anthropic-ai/claude-code
        run: |
          set -euo pipefail
          node packages/create-agent-marketplace/dist/bin.js \
            --template "$GITHUB_WORKSPACE/template" --template-ref main \
            --content "$CONTENT" --name selfcheck --owner Example \
            --dir "$RUNNER_TEMP/generated" --yes
      - name: Validate the generated repository
        working-directory: ${{ runner.temp }}/generated
        env:
          # Runners do not have the Claude Code CLI; the template's validation runs this command in place of `claude`.
          CLAUDE_COMMAND: npx --yes @anthropic-ai/claude-code
        run: pnpm run validate

  release:
    needs: [validate, template-selfcheck]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Two releases must never overlap and a queued one must not be cancelled.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push release commits and tags, create GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing (OIDC) and provenance; no npm token is used
    env:
      # RELEASE_TOKEN is an optional repository secret for a main that rejects direct pushes from the workflow token.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The compiled output is gitignored and the packages define no lifecycle scripts, so it is built here, before the release publishes.
      - run: pnpm run build
      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
